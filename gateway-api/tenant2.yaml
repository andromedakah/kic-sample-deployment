---
# This needs to be created to apply plugins that require an ingress class setting:
# https://docs.konghq.com/kubernetes-ingress-controller/latest/reference/resource-requiring-ingress-class/
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: t2-gw
spec:
  controller: konghq.com/kic-gateway-controller
---
apiVersion: v1
kind: Namespace
metadata:
  name: t2-gw
  labels:
    t2-gw-access: "true"
---
kind: GatewayConfiguration
apiVersion: gateway-operator.konghq.com/v1beta1
metadata:
  name: t2-gw
  namespace: t2-gw
spec:
  dataPlaneOptions:
    deployment:
      podTemplateSpec:
        spec:
          containers:
            - name: proxy
              image: kong:3.9.0
              readinessProbe:
                initialDelaySeconds: 1
                periodSeconds: 1
  controlPlaneOptions:
    deployment:
      podTemplateSpec:
        spec:
          containers:
            - name: controller
              image: kong/kubernetes-ingress-controller:3.4.1
              env:
                - name: CONTROLLER_LOG_LEVEL
                  value: debug
                - name: CONTROLLER_INGRESS_CLASS
                  value: t2-gw
---
kind: GatewayClass
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: t2-gw
spec:
  controllerName: konghq.com/gateway-operator
  parametersRef:
    group: gateway-operator.konghq.com
    kind: GatewayConfiguration
    name: t2-gw
    namespace: t2-gw
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: t2-gw
  namespace: t2-gw
spec:
  gatewayClassName: kong
  infrastructure:
    parametersRef:
      group: gateway-operator.konghq.com
      kind: GatewayConfiguration
      name: kong
  listeners:
    - name: prod-web
      port: 80
      protocol: HTTP
      allowedRoutes:
        kinds:
          - kind: HTTPRoute
        namespaces:
          from: Selector
          selector:
            matchLabels:
              t2-gw-access: "true"
---
apiVersion: v1
kind: Namespace
metadata:
  name: t2-service-1
  labels:
    t2-gw-access: "true"
---
kind: Service
apiVersion: v1
metadata:
  name: proxy-to-httpbin
  namespace: t2-service-1
spec:
  ports:
    - protocol: TCP
      port: 80
  type: ExternalName
  externalName: httpbin.org
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxy-to-httpbin
  namespace: t2-service-1
  annotations:
    konghq.com/strip-path: "true"
spec:
  parentRefs:
    - name: t2-gw
      namespace: t2-gw
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /httpbin
      backendRefs:
        - name: proxy-to-httpbin
          kind: Service
          port: 80
